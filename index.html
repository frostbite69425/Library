<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="main">
      <div class="hero">
        <button type="button" class="theme">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            height="24px"
            viewBox="0 -960 960 960"
            width="24px"
            fill="#ffffff"
          >
            <path
              d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Zm0-80q88 0 158-48.5T740-375q-20 5-40 8t-40 3q-123 0-209.5-86.5T364-660q0-20 3-40t8-40q-78 32-126.5 102T200-480q0 116 82 198t198 82Zm-10-270Z"
            />
          </svg>
        </button>
        <h1 class="heading">My Personal Library</h1>
      </div>
      <div class="new-book-btn">
        <button type="button">Add new book to the library.</button>
      </div>
      <div class="showcase">
        <p>My book collection</p>
        <div class="card-display"></div>
      </div>
      <dialog class="modal">
        <form class="book-form" id="book-form">
          <p>
            <label for="book-title">
              Title:
              <input type="text" name="title" id="book-title" autofocus />
            </label>
          </p>
          <p>
            <label for="book-author">
              Author:
              <input type="text" name="author" id="book-author" />
            </label>
          </p>
          <p>
            <label for="book-pages">
              Number of pages:
              <input type="number" name="pages" id="book-pages" />
            </label>
          </p>
          <p>
            <label for="book-reading-status">
              Read yet?
              <select name="reading-status" id="book-reading-status">
                <option value="yes">Yes</option>
                <option value="no">No</option>
              </select>
            </label>
          </p>
          <p>
            <label for="book-notes">
              <textarea
                name="notes"
                id="book-notes"
                rows="7"
                cols="30"
                placeholder="Comments"
              ></textarea>
            </label>
          </p>
          <div class="modal-btns">
            <button id="modalCancelBtn" value="cancel" formmethod="dialog">
              Cancel
            </button>
            <button id="modalConfirmBtn" value="default">Confirm</button>
          </div>
        </form>
      </dialog>
    </div>
  </body>
</html>
