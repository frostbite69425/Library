<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Personal Library</title>
    <link rel="shortcut icon" href="fav.ico" type="image/x-icon" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="main">
      <div class="hero">
        <button type="button" class="theme">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            height="24px"
            viewBox="0 -960 960 960"
            width="24px"
            fill="#ffffff"
          >
            <path
              d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Zm0-80q88 0 158-48.5T740-375q-20 5-40 8t-40 3q-123 0-209.5-86.5T364-660q0-20 3-40t8-40q-78 32-126.5 102T200-480q0 116 82 198t198 82Zm-10-270Z"
            />
          </svg>
        </button>
        <h1 class="heading">My Personal Library</h1>
      </div>
      <div class="new-book-btn">
        <button type="button">Add new book to the library.</button>
      </div>
      <div class="showcase">
        <p>My book collection</p>
        <div class="card-display"></div>
      </div>
      <dialog class="modal">
        <form class="book-form" id="book-form">
          <p>
            <label for="book-title">
              Title:
              <input
                type="text"
                name="title"
                maxlength="30"
                id="book-title"
                autofocus
                required
              />
            </label>
          </p>
          <p>
            <label for="book-author">
              Author:
              <input
                type="text"
                name="author"
                maxlength="20"
                id="book-author"
                required
              />
            </label>
          </p>
          <p>
            <label for="book-pages">
              Number of pages:
              <input
                type="number"
                name="pages"
                min="1"
                max="9999"
                id="book-pages"
                required
              />
            </label>
          </p>
          <p>
            <label for="book-reading-status">
              Read yet?
              <select name="reading-status" id="book-reading-status">
                <option value="yes">Yes</option>
                <option value="no">No</option>
              </select>
            </label>
          </p>
          <p>
            <label for="book-notes">
              <textarea
                name="notes"
                id="book-notes"
                rows="7"
                cols="30"
                placeholder="Comments"
                maxlength="100"
              ></textarea>
            </label>
          </p>
          <div class="modal-btns">
            <button id="modalCancelBtn" value="cancel" formmethod="dialog">
              Cancel
            </button>
            <button id="modalConfirmBtn" value="default">Confirm</button>
          </div>
        </form>
      </dialog>
      <div class="footer">
        <!-- From Uiverse.io by kamehame-ha -->
        <button type="button" class="button">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M12 0.296997C5.37 0.296997 0 5.67 0 12.297C0 17.6 3.438 22.097 8.205 23.682C8.805 23.795 9.025 23.424 9.025 23.105C9.025 22.82 9.015 22.065 9.01 21.065C5.672 21.789 4.968 19.455 4.968 19.455C4.422 18.07 3.633 17.7 3.633 17.7C2.546 16.956 3.717 16.971 3.717 16.971C4.922 17.055 5.555 18.207 5.555 18.207C6.625 20.042 8.364 19.512 9.05 19.205C9.158 18.429 9.467 17.9 9.81 17.6C7.145 17.3 4.344 16.268 4.344 11.67C4.344 10.36 4.809 9.29 5.579 8.45C5.444 8.147 5.039 6.927 5.684 5.274C5.684 5.274 6.689 4.952 8.984 6.504C9.944 6.237 10.964 6.105 11.984 6.099C13.004 6.105 14.024 6.237 14.984 6.504C17.264 4.952 18.269 5.274 18.269 5.274C18.914 6.927 18.509 8.147 18.389 8.45C19.154 9.29 19.619 10.36 19.619 11.67C19.619 16.28 16.814 17.295 14.144 17.59C14.564 17.95 14.954 18.686 14.954 19.81C14.954 21.416 14.939 22.706 14.939 23.096C14.939 23.411 15.149 23.786 15.764 23.666C20.565 22.092 24 17.592 24 12.297C24 5.67 18.627 0.296997 12 0.296997Z"
              fill="white"
            ></path>
          </svg>
          <p class="text">frostbite69425</p>
        </button>
      </div>
    </div>
  </body>
</html>
