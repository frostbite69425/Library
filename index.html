<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="main">
      <div class="hero">
        <h1>My Personal Library</h1>
      </div>
      <div class="showcase">
        <p>My book collection</p>
        <div class="container">
          <div class="card-display"></div>
        </div>
        <div class="new-book-btn">
          <button type="button">New book</button>
        </div>
      </div>
      <dialog class="modal">
        <form class="book-form">
          <p>
            <label for="book-title">
              Title:
              <input type="text" name="title" id="book-title" autofocus />
            </label>
          </p>
          <p>
            <label for="book-author">
              Author:
              <input type="text" name="author" id="book-author" />
            </label>
          </p>
          <p>
            <label for="book-pages">
              Number of pages:
              <input type="number" name="pages" id="book-pages" />
            </label>
          </p>
          <p>
            <label for="book-reading-status">
              Read yet?
              <select name="reading-status" id="book-reading-status">
                <option value="yes">Yes</option>
                <option value="no">No</option>
              </select>
            </label>
          </p>
          <p>
            <label for="book-notes">
              <textarea
                name="notes"
                id="book-notes"
                rows="7"
                cols="30"
                placeholder="Comments"
              ></textarea>
            </label>
          </p>
          <div class="modal-btns">
            <button value="cancel" formmethod="dialog">Cancel</button>
            <button id="modalConfirmBtn" value="default">Confirm</button>
          </div>
        </form>
      </dialog>
    </div>
  </body>
</html>
